    //   tricks     : completed tricks so far with their winner + leadSuit.
    remaining: ALL_CARDS.filter((c) => !played.some((p) => p.suit === c.suit && p.rank === c.rank) &&
      !own.some((o) => o.suit === c.suit && o.rank === c.rank)),
    suitsSeen: [...new Set(played.map((c) => c.suit))],
    tricks: (s.memory.tricks || []).map((t) => ({
      trickNum: t.trickNum, leadSuit: t.leadSuit, winner: t.winner,
      team: t.team, plays: t.plays.map((p) => ({ player: p.player, card: { ...p.card } })),
    })),
    voids: Object.fromEntries(SEATS.map((p) => [p, [...(s.memory.voids[p] || [])]])),
    handSizes: Object.fromEntries(SEATS.map((p) => {
      const inCur = s.trick.filter((t) => t.player === p).length;
      return [p, Math.min(13, Math.max(0, 13 - Math.max(0, s.trickNum - 1) - inCur))];
    })),
    signals: s.memory.signals || [],
    trick: s.trick.map((t) => ({ player: t.player, card: t.card })),
    leadSuit: s.leadSuit,
    starter: s.starter,
    tricksWon: { ...s.tricksWon },
    hakem: s.hakem,
    team: (p) => s.players[p].team,
    partnerOf: (p) => ({ 1: 3, 2: 4, 3: 1, 4: 2 })[p],
    opponentsOf: (p) => SEATS.filter((q) => q !== p && s.players[q].team !== s.players[p].team),
    _hc: new Map(),   // holdersOf cache: cardKey -> seats
    _rc: new Map(),   // suitCountRange cache: `p|suit`
    _bc: new Map(),   // beatersFor cache: `p|cardKey|lead`
  };
}

// Seats that have not played yet in this trick (excluding pid).
function stillToAct(M, pid) {
  const inTrick = new Set(M.trick.map((t) => t.player));
  return SEATS.filter((p) => p !== pid && !inTrick.has(p));
}

// Possible holders of an unaccounted card. Definite attribution ONLY for a card
// the viewer physically holds; everyone else gets membership in a candidate set.
function holdersOf(M, card) {
  const k = ckey(card);
  const hit = M._hc && M._hc.get(k);
  if (hit) return hit;
  let out;
  if (M.playedSet.has(k)) out = [];
  else if (M.ownSet.has(k)) out = [M.viewer];
  else {
    out = [];
    for (const p of SEATS) {
      if (p === M.viewer) continue;
      if (M.voids[p].includes(card.suit)) continue; // permanent proven void
      if (M.handSizes[p] <= 0) continue;
      out.push(p);
    }
  }
  if (M._hc) M._hc.set(k, out);
  return out;
}

function pHold(M, card, p) {
  const h = holdersOf(M, card);
  return h.includes(p) ? 1 / h.length : 0;
}

// Distribution bounds for `suit` at seat p (bridge-style, observables only).
function suitCountRange(M, p, suit) {
  const ck = p + '|' + suit;
  if (M._rc && M._rc.has(ck)) return M._rc.get(ck);
  const otherUnacc = ALL_CARDS.filter((c) => c.suit !== suit && holdersOf(M, c).includes(p)).length;
  const suitUnacc = ALL_CARDS.filter((c) => c.suit === suit && holdersOf(M, c).includes(p)).length;
  const r = { hi: Math.min(M.handSizes[p], suitUnacc), lo: Math.max(0, M.handSizes[p] - otherUnacc) };
  if (M._rc) M._rc.set(ck, r);
  return r;
}

function trumpSeen(M) {
  if (M.mode !== 'normal') return [];
  return M.played.filter((c) => c.suit === M.trump);
}

// Value of KEEPING card c for future tricks (0..1).
function futureValue(M, c) {
  let fv = cardVal(c, M.mode) / 13;
  if (M.mode === 'normal') {
    if (c.suit === M.trump) fv += 0.2;
    else if (c.rank === 'A') fv += 0.1;
    else if (c.rank === 'K') fv += 0.06;
  } else if (c.rank === 'A') fv += 0.08;
  return Math.min(1, fv);
}

// Cards seat p could LEGALLY play later in this trick that would overtake winnerCard.
// Legality is scenario-consistent: p must follow suit if p definitely holds lead
// (range.lo > 0); a trump ruff only counts when p might be void in lead.
function beatersFor(M, p, winnerCard, lead) {
  const ck = p + '|' + ckey(winnerCard) + '|' + lead;
  if (M._bc && M._bc.has(ck)) return M._bc.get(ck);
  const out = [];
  const mustFollow = suitCountRange(M, p, lead).lo > 0;
  for (const c of ALL_CARDS) {
    const k = ckey(c);
    if (M.playedSet.has(k) || M.ownSet.has(k)) continue;
    if (!holdersOf(M, c).includes(p)) continue;
    if (cmpCards(c, winnerCard, lead, M.mode, M.trump) <= 0) continue; // cannot overtake
    if (c.suit !== lead) {
      if (M.mode !== 'normal' || c.suit !== M.trump) continue; // only trumps beat off-suit
      if (mustFollow) continue;                                // p must follow: no ruff
    }
    out.push({ card: c, p, prob: pHold(M, c, p) });
  }
  if (M._bc) M._bc.set(ck, out);
  return out;
}

// Classify candidate play c for pid. status:
//   secure       — my card wins and NO remaining player (opponent OR partner) can
//                  overtake it under any scenario consistent with observables
//                  (spec-strict). Biggest-card-ness alone is NOT enough.
//   possible     — my card currently wins but could still be overtaken
//   low          — could win, winProb < 0.15
//   non-winning  — partner currently wins; this card rides along (never overtakes)
//   dead         — an opponent's played card beats mine and nothing gives the team
//                  the trick back: zero chance of winning THIS trick
function classifyPlay(M, pid, card) {
  const lead = M.leadSuit || card.suit;
  const entries = [...M.trick, { player: pid, card }];
  const winner = trickWinner(entries, lead, M.mode, M.trump);
  const myTeam = M.team(pid);
  const partner = M.partnerOf(pid);
  const iWin = winner.player === pid;
  const partnerWin = winner.player === partner;
  const oppWin = winner.player !== pid && winner.player !== partner;
  // partner owned the trick BEFORE my card (for the don't-overtake-partner rule)
  let visW = null;
  for (const t of M.trick) if (!visW || cmpCards(t.card, visW.card, lead, M.mode, M.trump) > 0) visW = t;
  const partnerWasWinning = !!visW && visW.player === partner;

  const rest = stillToAct(M, pid);
  const oppRest = rest.filter((p) => M.team(p) !== myTeam);
  const ownRest = rest.filter((p) => M.team(p) === myTeam && p !== partner);

  // threats against MY card (overtaking me at all, incl. partner) → myWinProb
  const vsMine = [];
  for (const p of rest) vsMine.push(...beatersFor(M, p, card, lead));
  const myProb = iWin ? probNoneHold(rest, vsMine) : 0;

  // threats by OPPONENTS against the current team winner (partner or me) → teamWin
  const effW = iWin ? card : winner.card;
  const oppThreats = [];
  for (const p of oppRest) oppThreats.push(...beatersFor(M, p, effW, lead));
  // threats BY OUR SIDE against an opponent winner → chance to reclaim
  const ourThreats = [];
  for (const p of ownRest.concat(partner !== pid ? [partner] : [])) {
    if (M.team(p) !== myTeam) continue;
    ourThreats.push(...beatersFor(M, p, winner.card, lead));
  }
  let teamProb;
  if (iWin || partnerWin) teamProb = probNoneHold(oppRest, oppThreats);
  else teamProb = oppWin ? 1 - probNoneHold(ownRest.concat([partner].filter((p) => p !== pid)), ourThreats) : 0;
  teamProb = Math.max(0, Math.min(1, teamProb));

  let status;
  if (iWin && vsMine.length === 0) status = 'secure';
  else if (iWin && myProb < 0.15) status = 'low';
  else if (iWin) status = 'possible';
  else if (partnerWin) status = 'non-winning';
  else status = 'dead';

  return {
    status, card, pid, lead,
    winProb: myProb, teamWin: teamProb,
    secureTeamWin: oppThreats.length === 0 && (iWin || partnerWin),
    iWin, partnerWin, oppWin, partnerWasWinning,
    threats: iWin ? vsMine : oppWin ? ourThreats : [],
  };
}

// Π over seats of (1 - Σ prob of their distinct beaters), clamped per seat.
function probNoneHold(seats, threats) {
  const bySeat = {};
  for (const t of threats) (bySeat[t.p] = bySeat[t.p] || []).push(t.prob);
  let q = 1;
  for (const p of seats) {
    const ps = bySeat[p];
    if (!ps || !ps.length) continue;
    let pb = 0;
    for (const x of ps) pb = Math.min(1, pb + x);
    q *= 1 - pb;
  }
  return q;
}

// Spec-strict secure win (knowledge-layer variant; rules.js still exports the
// legacy old-compatible helper of the same name for the equivalence tests):
// true ONLY if no logically-consistent scenario lets ANY remaining player
// (opponents OR partner) overtake this card in the current trick.
function secureWin(M, pid, card) {
  return classifyPlay(M, pid, card).status === 'secure';
}

// Partner signal aggregation (weights, contradictory signals summed, kept).
function signalScore(M, pid, suit) {
  const partner = M.partnerOf(pid);
  let w = 0;
  for (const sg of M.signals) if (sg.player === partner && sg.suit === suit) w += sg.weight;
  return w;
}

// §6 ANTI_KOT — our side is on 0 tricks while opponents are close to the 7-0 KOT
// line (game.js fires KOT at 7-0). Single source of truth for RiskEngine, the
// Decision Engine and Analysis; derived only from observable tricksWon counts.
function antiKotActive(M, pid) {
  const team = M.team(pid);
  const opp = team === 'A' ? 'B' : 'A';
  return M.tricksWon[team] === 0 && M.tricksWon[opp] >= 5;
}

// src/risk.js — RiskEngine. Combines score gap, tricks remaining, hand quality,
// trump control, secure-win availability, partner support and endgame pressure.
// Ahead → conservative; behind (especially near the opponent's 7th trick) →
// aggressive. Returns a number: >0 accept risk, <=0 safety first.


// ANTI_KOT_MODE (§6): our side still on 0 tricks while the opponents are close to
// the 7-0 KOT line. Retention of A/K stops mattering, gambles open up.
function antiKOTMode(s, pid) {
  const M = buildMemory(s, pid);
  return antiKotActive(M, pid);
}

function riskAppetite(s, pid) {
  const M = buildMemory(s, pid);
  const team = M.team(pid);
  const opp = team === 'A' ? 'B' : 'A';
  const ahead = M.tricksWon[team] - M.tricksWon[opp];
  const tricksLeft = Math.max(0, 13 - (M.trickNum - 1));
  const oppAt6 = M.tricksWon[opp] === 6;
  const antiKOTActive = antiKotActive(M, pid);

  let score = -ahead * 2;
  if (oppAt6) score += 3;
  if (ahead >= 2) score -= 2;
  if (tricksLeft <= 4) score += ahead < 0 ? 2 : -1;

  // §6 ANTI_KOT_MODE: getting at least one trick dominates safety — risk rises.
  if (antiKOTActive) {
    score += 2;
    if (tricksLeft <= 3) score += 2;
  }

  if (M.mode === 'normal' && M.trump) {
    const myT = M.own.filter((c) => c.suit === M.trump);
    score += Math.min(2, myT.length) - (trumpSeen(M).length > 6 ? 1 : 0);
    const top = Math.max(0, ...myT.map((c) => cardVal(c, 'normal')));
    if (top >= 12) score += 1;
  } else {
    score += 0.5; // no trump suit to control: flatter risk
  }

  // secure wins available right now (own hand vs remaining seats, observables only)
  const lead = M.leadSuit;
  let secures = 0;
  for (const c of M.own) {
    if (lead && c.suit !== lead && (M.mode !== 'normal' || c.suit !== M.trump)) continue;
    let safe = true;
    for (const p of M.opponentsOf(pid).filter((q) => stillToAct(M, pid).includes(q))) {
      if (beatersFor(M, p, c, lead || c.suit).length) { safe = false; break; }
    }
    if (safe) secures++;
  }
  if (secures === 0) score += 1;
  if (secures >= 3) score -= 1;

  let support = 0;
  for (const sg of M.signals) if (sg.player === M.partnerOf(pid) && sg.weight >= 2) support += 1;
  score -= Math.min(1, support * 0.5);

  return score;
}

// Endgame mode: last 3 tricks of a round. Same Decision Engine, shifted weights.
function endgameWeights(s) {
  const tricksLeft = Math.max(0, 13 - (s.trickNum - 1));
  if (tricksLeft > 3) return null;
  return {
    tricksLeft,
    winNowMult: 1.6,
    futureMult: 0.5,
    controlMult: 1.2,
  };
}

// src/decision.js — the Decision Engine shared by AI seats, Analysis and Coach.
// Pipeline per turn (spec):
//   GameState → CardMemory/Inference (knowledge.js) → LegalMoves → TrickAnalysis →
//   PartnerSignals → GoalSelection → CandidateMoveScoring → Risk/FutureValue →
//   Decision (chosen card + ranked alternatives + short human reason)
//
// All evaluation uses decision-time observables only. Hidden cards are never
// consulted, so the same engine can grade a past decision without hindsight.



const GOALS = [
  'WIN_TRICK', 'PROTECT_PARTNER', 'FORCE_TRUMP', 'DRAW_TRUMPS', 'CREATE_VOID',
  'PRESERVE_HIGH_CARD', 'PARTNER_SUPPORT', 'BLEED_LOW_CARD', 'FORCE_EXPENSIVE_RESPONSE',
  // Tactical rules v2 (decision-time observables only)
  'THIRD_SEAT_MAX_PRESSURE', 'FORCE_OPPONENT_PREMIUM_RESPONSE', 'ESTABLISH_SECONDARY_HONOR',
  'TRUMP_CONTROL', 'ANTI_KOT', 'PARTNER_CONTINUATION_SIGNAL',
];

function shortnessBonus(M, pid, c) {
  // singleton/doubleton side suit → dumping creates a void for future ruffs
  if (M.mode !== 'normal' || c.suit === M.trump) return 0;
  const n = M.own.filter((x) => x.suit === c.suit).length;
  if (n === 1) return 0.5;
  if (n === 2) return 0.2;
  return 0;
}

function drawTrumpsBonus(M, pid, c) {
  if (M.mode !== 'normal' || !M.trump || c.suit !== M.trump) return 0;
  const opps = M.opponentsOf(pid);
  const bothVoidTrump = opps.length === 2 && opps.every((p) => M.voids[p].includes(M.trump));
  if (bothVoidTrump) return 0.6;
  const liveDesc = RANKS.slice().sort((a, b) => RANKS.indexOf(b) - RANKS.indexOf(a))
    .filter((r) => !M.playedSet.has(ckey({ suit: M.trump, rank: r })));
  let run = 0;
  for (const r of liveDesc) {
    if (M.own.some((x) => x.suit === M.trump && x.rank === r)) run++;
    else break;
  }
  return run >= 3 ? 0.45 : 0;
}

// Force-expensive-response: if an opponent CAN overtake my winning card, they must
// spend something that matters (top honors or a trump) — tactical gain even if I lose.
function expensiveResponseBonus(M, pid, card, cls) {
  if (!cls.iWin) return 0;
  let b = 0;
  for (const p of M.opponentsOf(pid).filter((q) => stillToAct(M, pid).includes(q))) {
    const bs = beatersFor(M, p, card, cls.lead);
    if (!bs.length) continue;
    const top = Math.max(...bs.map((x) => cardVal(x.card, M.mode)));
    const ruffBeat = M.mode === 'normal' && bs.some((x) => x.card.suit === M.trump && card.suit !== M.trump);
    if (top >= 12 || ruffBeat) b += 0.35;
  }
  return b;
}

// ---------- Tactical rules v2 (decision-time observables only) ----------
function trumpControlPair(M) {
  if (M.mode !== 'normal' || !M.trump) return false;
  const t = M.own.filter((x) => x.suit === M.trump);
  return t.some((x) => x.rank === 'A') && t.some((x) => x.rank === 'K');
}

// Cards pid could legally have played at decision time (follow suit if able).
function legalPool(M, pid) {
  const lead = M.leadSuit;
  const must = lead && M.own.some((x) => x.suit === lead);
  return must ? M.own.filter((x) => x.suit === lead) : M.own;
}

// §1 + §2 + §4 — partner currently owns the trick and I hold a card that WOULD
// overtake it. Ducking a low card keeps partner on top and forces the player after
// me to pay a premium (top honor or a trump) — "maximum pressure" is NOT "biggest
// card". Acting last, the same duck is the positive PARTNER_CONTINUATION_SIGNAL
// ("this suit is guarded in my hand — lead it again").
function duckUnderPartner(M, pid, c, cls, kotRisk) {
  const out = { score: 0, tags: [] };
  if (cls.status !== 'non-winning' || !cls.partnerWasWinning || M.trick.length < 2) return out;
  const lead = M.leadSuit;
  if (!lead || c.suit !== lead) return out;
  let w = M.trick[0];
  for (const t of M.trick) if (cmpCards(t.card, w.card, lead, M.mode, M.trump) > 0) w = t;
  if (w.player !== M.partnerOf(pid)) return out;
  // I must actually hold a higher usable card of that suit (real, keepable power)
  const higher = legalPool(M, pid).some((x) => cmpCards(x, w.card, lead, M.mode, M.trump) > 0);
  if (!higher) return out;
  if (cardVal(c, M.mode) >= cardVal(w.card, M.mode)) return out; // strictly under partner
  const rest = stillToAct(M, pid);
  // one opponent still to act behind me: they must spend A/K or a trump
  if (rest.length === 1 && M.team(rest[0]) !== M.team(pid)) {
    const bs = beatersFor(M, rest[0], w.card, lead);
    const premium = bs.filter((b) => cardVal(b.card, M.mode) >= 13 ||
      (M.mode === 'normal' && b.card.suit === M.trump && w.card.suit !== M.trump));
    if (premium.length) {
      out.score += kotRisk ? 0.2 : 0.7;
      out.tags.push('THIRD_SEAT_MAX_PRESSURE', 'FORCE_OPPONENT_PREMIUM_RESPONSE');
    }
  }
  // I act last: partner takes the trick, low card = guarded-suit signal
  if (rest.length === 0) { out.score += 0.7; out.tags.push('PARTNER_CONTINUATION_SIGNAL'); }
  return out;
}

// §3 first-trick lead adjustment: TRUMP_CONTROL, TRUMP_ACE avoidance, SECONDARY_HONOR setup
function firstTrickLeadAdjust(M, pid, c, kotRisk) {
  const out = { score: 0, tags: [] };
  const isTrump = M.mode === 'normal' && !!M.trump && c.suit === M.trump;
  const trumps = M.mode === 'normal' && M.trump ? M.own.filter((x) => x.suit === M.trump) : [];
  const akPair = trumps.some((x) => x.rank === 'A') && trumps.some((x) => x.rank === 'K');
  if (isTrump) {
    if (akPair) out.tags.push('TRUMP_CONTROL');
    if (c.rank === 'A') {
      const controlOurs = akPair && trumps.length >= 3;
      if (!kotRisk) out.score -= controlOurs ? 2 : 6;
    } else if (c.rank === 'K' && akPair && !kotRisk) out.score -= 1.5;
    return out;
  }
  if (kotRisk) return out;
  if (c.rank === 'K' || c.rank === 'Q') {
    const lower = M.own.some((x) => x.suit === c.suit && cardVal(x, M.mode) < cardVal(c, M.mode));
    if (lower) { out.score -= 2; out.tags.push('ESTABLISH_SECONDARY_HONOR'); }
  } else if (M.mode === 'normal' && cardVal(c, 'normal') < 11 &&
             M.own.some((x) => x.suit === c.suit && (x.rank === 'K' || x.rank === 'Q'))) {
    // any card below the honor (8/9/10/J included, not just 2-7) draws the higher
    // opposition card out and keeps our K/Q for later suit control
    out.score += 0.6; out.tags.push('ESTABLISH_SECONDARY_HONOR');
  }
  return out;
}

function pressureBonus(M, pid, card) {
  let b = 0;
  for (const p of M.opponentsOf(pid)) {
    const r = suitCountRange(M, p, card.suit);
    if (r.hi === 0) b += 0.45;
    else if (r.lo === 0 && r.hi <= 2) b += 0.15;
  }
  return Math.min(0.5, b);
}

function scoreMoves(s, pid) {
  const M = buildMemory(s, pid);
  const legal = playable(s, pid);
  const lead = M.trick.length === 0;
  const risk = riskAppetite(s, pid);
  const endg = endgameWeights(s);
  const winMult = endg ? endg.winNowMult : 1;
  const futMult = endg ? endg.futureMult : 1;
  const ctrlMult = endg ? endg.controlMult : 1;
  const partner = M.partnerOf(pid);
  const kotRisk = antiKotActive(M, pid);

  const scored = legal.map((c) => {
    const cls = classifyPlay(M, pid, c);
    const v = cardVal(c, M.mode);
    const fv = futureValue(M, c);
    const goals = [];
    let sc = 0;

    if (cls.status === 'secure') {
      // secured trick win outranks future positioning unless clearly justified
      sc += 10 * winMult;
      goals.push('WIN_TRICK');
      sc += expensiveResponseBonus(M, pid, c, cls) * 0.5;
    } else if (cls.status === 'possible') {
      sc += (3.5 + 3 * cls.winProb) * winMult * (risk > 0 ? 1 : 0.6);
      goals.push('WIN_TRICK');
      sc += expensiveResponseBonus(M, pid, c, cls);
    } else if (cls.status === 'low') {
      sc += 0.5 * cls.winProb * Math.max(0, risk);
    } else if (cls.status === 'non-winning') {
      // partner/team keeps it: shed the card with the LOWEST future value;
      // never dump a valuable trump unnecessarily
      goals.push('PROTECT_PARTNER');
      sc += 8 - 3 * fv;
      if (M.mode === 'normal' && c.suit === M.trump && M.leadSuit !== M.trump) sc -= 4;
    } else {
      // dead for this trick: bleed lowest future value, preserve real cards
      goals.push('BLEED_LOW_CARD');
      sc += 5 - 2.5 * fv;
    }

    if (cls.iWin && cls.status !== 'secure' && v >= 12 && lead) {
      // cashing a big card as lead while it could wait: preserve unless it secures
      sc -= 1.2 * futMult;
      goals.push('PRESERVE_HIGH_CARD');
    }

    if (lead) {
      const dt = drawTrumpsBonus(M, pid, c);
      if (dt > 0) { sc += dt * 2.2 * ctrlMult; goals.push('DRAW_TRUMPS'); }
      const sb = shortnessBonus(M, pid, c);
      if (sb > 0) { sc += sb * 2; goals.push('CREATE_VOID'); }
      sc += pressureBonus(M, pid, c) * 1.5;
      const sig = signalScore(M, pid, c.suit);
      if (sig >= 2 && !(M.mode === 'normal' && c.suit === M.trump)) { sc += Math.min(3, sig); goals.push('PARTNER_SUPPORT'); }
      if (M.mode === 'normal' && c.suit === M.trump && dt <= 0) sc -= 2; // no gratuitous trump leads
    }

    // cheapest sufficient trump when ruffing (spec: کمترین حکم کافی)
    if (M.mode === 'normal' && M.trump && c.suit === M.trump && cls.iWin &&
        (!M.leadSuit || !M.own.some((x) => x.suit === M.leadSuit && x !== c))) {
      goals.push('FORCE_TRUMP');
      const cheaperWorks = M.own.some((x) => x.suit === M.trump && cardVal(x, 'normal') < v &&
        classifyPlay(M, pid, x).iWin);
      if (cheaperWorks) sc -= 1.5; // a smaller trump does the same job
      // §5 — A+K held together is a TRUMP_CONTROL_PAIR: never burn one of them on a
      // ruff a smaller trump already wins, unless the team is fighting a KOT.
      if (cheaperWorks && !kotRisk && trumpControlPair(M) && (c.rank === 'A' || c.rank === 'K')) {
        sc -= 2.5;
        goals.push('TRUMP_CONTROL');
      }
      if (risk <= 0 && !cls.secureTeamWin) sc -= 2.5; // conservative: skip coin-flip ruffs
      sc += expensiveResponseBonus(M, pid, c, cls);    // forcing big trump spend = gain
    }

    if (endg && cls.status === 'secure') sc += endg.tricksLeft <= 2 ? 3 : 1.5;

    // never overtake the partner's winning trick
    if (cls.partnerWasWinning && cls.iWin) sc -= 6;

    // §6 ANTI_KOT_MODE — taking ANY trick outranks preserving honors or safety
    if (kotRisk && (cls.iWin || cls.secureTeamWin)) { sc += 2.5; goals.push('ANTI_KOT'); }
    if (kotRisk && cls.status === 'possible') sc += 1.2 * (1 - cls.winProb); // gamble is the point

    // §2 positional 3rd seat winning = max pressure applied (tag only, no bias)
    if (M.trick.length === 2 && cls.iWin && !cls.partnerWasWinning) {
      const rest = stillToAct(M, pid);
      if (rest.length === 1 && M.team(rest[0]) !== M.team(pid)) {
        const bs = beatersFor(M, rest[0], c, cls.lead);
        if (bs.some((b) => cardVal(b.card, M.mode) >= 13 ||
            (M.mode === 'normal' && b.card.suit === M.trump && c.suit !== M.trump))) {
          sc += 0.7;
          goals.unshift('THIRD_SEAT_MAX_PRESSURE', 'FORCE_OPPONENT_PREMIUM_RESPONSE');
        } else {
          goals.unshift('THIRD_SEAT_MAX_PRESSURE');
        }
      } else {
        goals.unshift('THIRD_SEAT_MAX_PRESSURE');
      }
    }

    // §3/§5 first-trick lead context (trump A / A+K pair / secondary honor setup)
    if (lead && M.trickNum === 1) {
      const ft = firstTrickLeadAdjust(M, pid, c, kotRisk);
      sc += ft.score;
      for (const t of ft.tags) if (!goals.includes(t)) goals.push(t);
    }

    return { card: c, score: sc, goals: [...new Set(goals)], cls, fv, v };
  });

  scored.sort((a, b) => b.score - a.score || a.fv - b.fv || a.v - b.v);
  return { scored, M, risk, endg };
}

// §7 DETERMINISM: the Decision Engine contains NO source of randomness. Given the
// same game state it always returns the same card. The softmax/rng variation that
// used to break near-ties is gone: the argmax is taken with the fixed tie-break in
// scoreMoves (score desc, then lowest future value, then lowest rank value). A tie
// is resolved by that fixed order — never by Math.random or a seeded rng.
// `rng` is accepted only for signature compatibility with older callers and is
// never consulted; passing one would not change the answer.
function decide(s, pid, rng) {
  void rng;
  const { scored } = scoreMoves(s, pid);
  if (!scored.length) return null;
  const pick = scored[0];
  return {
    card: pick.card, pick, top: pick, second: scored[1] || null, ranked: scored,
    goals: pick.goals, reason: explain(pick),
  };
}

// Short, human, decision-time-only reason (used by Coach + Analysis + last-trick).
const SYM = { spades: '♠', hearts: '♥', diamonds: '♦', clubs: '♣' };
function explain(mv) {
  const c = mv.card, sym = SYM[c.suit], g = mv.goals[0] || 'BLEED_LOW_CARD';
  const t = Math.round((mv.cls.winProb || 0) * 100);
  switch (g) {
    case 'WIN_TRICK':
      return mv.cls.status === 'secure'
        ? `${sym}${c.rank} برد قطعی است — هیچ بازیکن باقی‌مانده‌ای با اطلاعات موجود نمی‌تواند ببراند.`
        : `${sym}${c.rank} با احتمال ≈${t}٪ دست را می‌برد.`;
    case 'PROTECT_PARTNER':
      return `یار در حال بردن است؛ کم‌ارزش‌ترین کارت از نظر آینده (${sym}${c.rank}) پاس داده می‌شود.`;
    case 'FORCE_TRUMP':
      return `برش با ${sym}${c.rank} برای گرفتن دست.`;
    case 'DRAW_TRUMPS':
      return `کشیدن حکم؛ کنترل ترمپ در این وضعیت ارزش بالایی دارد.`;
    case 'CREATE_VOID':
      return `خالی‌کردن ${sym} تا در دست‌های بعد بتوانی برش بزنی.`;
    case 'PRESERVE_HIGH_CARD':
      return `نگه داشتن ارزش برای آینده؛ برد فعلی ضروری نیست.`;
    case 'PARTNER_SUPPORT':
      return `سیگنال یار در ${sym} قوی است؛ همان خال لید می‌شود.`;
    case 'BLEED_LOW_CARD':
      return `این دست با اطلاعات فعلی بردنی نیست؛ ${sym}${c.rank} کمارزش‌ترین کارت آینده است.`;
    case 'FORCE_EXPENSIVE_RESPONSE':
      return `اگر حریف بخواهد این را بگیرد، مجبور است کارت باارزش خرج کند.`;
    case 'THIRD_SEAT_MAX_PRESSURE':
      return `نفر سوم نهایت فشار را وارد می‌کند — مجبور کردن حریف به خرج A/K.`;
    case 'FORCE_OPPONENT_PREMIUM_RESPONSE':
      return `فشار وارد کردن روی حریف برای خروج کارت باارزش A/K.`;
    case 'ESTABLISH_SECONDARY_HONOR':
      return `برقرار کردن یک جایزه دوم -- K/Q بالاتر بعد.`;
    case 'PARTNER_CONTINUATION_SIGNAL':
      return `سیگنال به یار -- همان خال لید می‌شود.`;
    case 'TRUMP_CONTROL':
      return `کنترل ترمپ -- حفظ کنترل حکم در این وضعیت.`;
    case 'ANTI_KOT':
      return `ضد کت -- جلوگیری از اینکه حریف به K/SX برسه.`;
    default:
      return `امتیاز ${mv.score.toFixed(1)}`;
  }
}

// src/positions.js — Position Policies (spec §4).
//
// One INDEPENDENT, individually testable policy per trick position. The position is
// the number of cards already on the table when the seat acts:
//
//   LEADER  (0 played) — chooses the lead suit; sets the agenda for the trick
//   SECOND  (1 played) — must follow if able; otherwise defends or ruffs
//   THIRD   (2 played) — middle hand: pressure or discard, partner-aware
//   FOURTH  (3 played) — last hand: knows exactly who is winning and what beats it
//
// Every policy is a pure function (state, pid) -> { card, reason, ... } reading only
// the knowledge layer. They never consult hidden cards and contain NO randomness
// (§7): same state in, same card out, forever. The shared scoring from decision.js
// is the backbone; each policy applies its positional constraints on top of it.
//
// Decision rights each policy OWNS (tested individually in tests/positions.test.js):
//   LEADER  : which suit to lead, trump included, from void/signal/pressure facts
//   SECOND  : follow-suit is forced; the choice is only WHICH card of the suit,
//             or — when void — ruff vs shed
//   THIRD   : overtaking partner vs ducking; forcing the 4th seat to pay
//   FOURTH  : "can I beat the current winner?" — if yes, take or duck deliberately;
//             if no, discard the card with the lowest future value



const LEADER = 'LEADER';
const SECOND = 'SECOND';
const THIRD = 'THIRD';
const FOURTH = 'FOURTH';

// Position of `pid` within the current trick: the count of cards already played
// before this seat acts. Derived purely from s.trick (observable).
function positionOf(s, pid) {
  const n = s.trick.filter((t) => t.player !== pid).length;
  return [LEADER, SECOND, THIRD, FOURTH][n] || LEADER;
}

// ---------- shared helpers ----------

// Card comparison goes through the single rules.cmpCards implementation. A local
// mirror used to live here and silently diverged in ners/asners rounds (it ranked
// cards by the normal-suit order, so the policies mis-identified the trick winner
// whenever the round was not played with the normal trump order). One source of truth.
function winnerOfTrick(M) {
  if (!M.trick.length) return null;
  let w = M.trick[0];
  for (const t of M.trick.slice(1)) {
    if (cmpCards(t.card, w.card, M.leadSuit, M.mode, M.trump) > 0) w = t;
  }
  return w;
}

// Mode-correct card value (rank order flips in ners/asners). Every "cheapest" /
// "lowest" decision in the policies must use this, not raw rank order.
const valOf = (M, c) => cardVal(c, M.mode);

// Does card c beat the current winning card, under led-suit + trump rules?
function beats(M, c, winnerCard) {
  return cmpCards(c, winnerCard, M.leadSuit, M.mode, M.trump) > 0;
}

// Cheapest card of `cards` that still beats `winnerCard` (a FOURTH/THIRD staple:
// take the trick with the smallest sufficient card, never waste an honor).
function cheapestBeater(M, cards, winnerCard) {
  return cards
    .filter((c) => beats(M, c, winnerCard))
    .sort((a, b) => valOf(M, a) - valOf(M, b))[0] || null;
}

// Human-readable card, e.g. "♠Q".
const nm = (c) => `${SYMBOLS[c.suit]}${c.rank}`;

// ===========================================================================
// LEADER — first to act. Owns the lead-suit decision.
// ===========================================================================
// Obligations (spec):
//   • picks the lead suit deliberately (never a random card)
//   • weighs trump: leading trump is only done to draw the opponents' trumps or to
//     press a known void — never gratuitously
//   • uses played cards, known voids and partner signals (knowledge layer only)
// Strategy: prefer a suit we hold LENGTH in where at least one opponent is known
// void (pure pressure: the trick cannot be ruffed by that opponent, and partner may
// still support); avoid leading a bare high card when a lower card of the same suit
// establishes it. Fallback: the engine's deterministic ranked list.
function leaderPolicy(s, pid) {
  const { scored, M } = scoreMoves(s, pid);
  if (!scored.length) return null;
  const opponents = M.opponentsOf(pid);

  // Pressure suit: a non-trump suit in hand where some opponent is proven void.
  // Leading it can never be ruffed by that opponent and forces them to spend.
  const pressure = [];
  for (const c of M.own) {
    if (M.mode === 'normal' && c.suit === M.trump) continue;
    if (pressure.some((x) => x.suit === c.suit)) continue;
    if (opponents.some((p) => M.voids[p].includes(c.suit))) pressure.push(c);
  }
  if (pressure.length) {
    // highest-scoring card among pressure suits (scoreMoves already credits
    // pressureBonus; this guarantees the lead stays in a pressure suit)
    const inPressure = scored.filter((m) => pressure.some((p) => p.suit === m.card.suit));
    if (inPressure.length) {
      const pick = inPressure[0];
      return ok(pick, `lead ${nm(pick.card)} — حریف در این خال void شده و نمی‌تواند برش بزند`, 'PRESSURE_LEAD');
    }
  }

  // Partner signal: partner previously signalled strength in a suit.
  for (const m of scored) {
    const sig = M.signals.filter((g) => g.player === M.partnerOf(pid) && g.suit === m.card.suit)
      .reduce((a, g) => a + g.weight, 0);
    if (sig >= 2 && !(M.mode === 'normal' && m.card.suit === M.trump)) {
      return ok(m, `lead ${nm(m.card)} — سیگنال قوی یار در ${SYMBOLS[m.card.suit]}`, 'PARTNER_SIGNAL_LEAD');
    }
  }

  // No pressure and no signal: trust the engine's deterministic ranking. The engine
  // already penalizes gratuitous trump leads and preserves secondary honors.
  const pick = scored[0];
  return ok(pick, explain(pick), rankedGoals(pick));
}

// ===========================================================================
// SECOND — one card on the table.
// ===========================================================================
// Obligations (spec):
//   • if the led suit is held, MUST follow it (rules.playable already forces this;
//     the policy only ever sees legal cards)
//   • when void, the choice is strategic — not "dump the cheapest card": ruff when
//     the trick is worth taking or the team must stop the opponents, otherwise shed
//     the card with the lowest future value while keeping trump
function secondPolicy(s, pid) {
  const { scored, M } = scoreMoves(s, pid);
  if (!scored.length) return null;
  const legal = playable(s, pid);
  const hasSuit = M.leadSuit && legal.some((c) => c.suit === M.leadSuit);
  const w = winnerOfTrick(M);

  // --- Case 1: must follow the led suit. Which card of the suit? ---
  if (hasSuit) {
    const inSuit = legal.filter((c) => c.suit === M.leadSuit);
    // If partner led and is still winning, ride along with the lowest card that
    // does not overtake partner (never burn an honor needlessly).
    if (w && M.team(w.player) === M.team(pid) && inSuit.length > 1) {
      const under = inSuit.filter((c) => !beats(M, c, w.card)).sort((a, b) => valOf(M, a) - valOf(M, b))[0];
      if (under) return ok(scoredFor(scored, under),
        `یار برنده است؛ ${nm(under)} زیر یار بازی می‌شود تا افتخار آسیب نبیند`, 'DUCK_UNDER_PARTNER');
    }
    // An opponent is winning. If we can beat them cheaply, do it with the smallest
    // sufficient card; otherwise shed the lowest card of the suit (keep honors for a
    // trick we can actually win — never waste the A to capture a 2).
    if (w && M.team(w.player) !== M.team(pid)) {
      const cheap = cheapestBeater(M, inSuit, w.card);
      if (cheap && inSuit.length > 1) {
        return ok(scoredFor(scored, cheap),
          `${nm(cheap)} ارزان‌ترین کافی برای بردن دست است`, 'CHEAPEST_SUFFICIENT_WIN');
      }
      const lowest = inSuit.slice().sort((a, b) => valOf(M, a) - valOf(M, b))[0];
      return ok(scoredFor(scored, lowest),
        `امکان برد نیست؛ ${nm(lowest)} کم‌ارزش‌ترین کارت خال لید در دست است`, 'SHED_LOWEST_OF_SUIT');
    }
    // Nobody meaningful to chase: engine ranking decides.
    const pick = scored[0];
    return ok(pick, explain(pick), rankedGoals(pick));
  }

  // --- Case 2: void in the led suit. Ruff or shed? ---
  const trump = M.mode === 'normal' ? M.trump : null;
  const trumps = trump ? legal.filter((c) => c.suit === trump) : [];
  const oppWinning = w && M.team(w.player) !== M.team(pid);
  const teamWinning = w && M.team(w.player) === M.team(pid);

  if (trumps.length) {
    // Ruffing partner's winner is forbidden — the team already owns the trick.
    if (teamWinning) {
      const shed = legal.slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
      return ok(scoredFor(scored, shed),
        `یار برنده است؛ برش زدن بی‌فایده است، ${nm(shed)} دور انداخته می‌شود`, 'SHED_KEEP_TRUMP');
    }
    // Opponent winning, or we are the first to commit: ruff with the smallest trump
    // that actually beats the current winner (never burn the A when the 2 suffices).
    const target = oppWinning ? w.card : null;
    const ruff = target
      ? trumps.slice().sort((a, b) => valOf(M, a) - valOf(M, b)).find((c) => beats(M, c, target)) || null
      : trumps.slice().sort((a, b) => valOf(M, a) - valOf(M, b))[0];
    if (ruff) {
      return ok(scoredFor(scored, ruff),
        `برش با ${nm(ruff)} — کمترین حکم کافی برای گرفتن دست`, 'RUFF_CHEAPEST');
    }
  }

  // No trump usable: discard the lowest-future-value card, preferring non-trump.
  const shed = legal.slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
  return ok(scoredFor(scored, shed),
    `خال لید نداریم؛ ${nm(shed)} کم‌ارزش‌ترین کارت آینده است`, 'SHED_LOWEST_FUTURE');
}

// ===========================================================================
// THIRD — two cards on the table.
// ===========================================================================
// Obligations (spec): middle hand balances attack and defense.
//   • if partner is winning, duck under them (signal "I have the suit guarded") and
//     force the fourth seat to spend a premium card to take it
//   • if an opponent is winning and we can beat them, apply maximum pressure: win as
//     cheaply as suffices so the last opponent must pay an honor or a trump
//   • if nothing can be won, discard/defend — shed the lowest future value, keep trump
function thirdPolicy(s, pid) {
  const { scored, M } = scoreMoves(s, pid);
  if (!scored.length) return null;
  const legal = playable(s, pid);
  const w = winnerOfTrick(M);
  const last = stillToAct(M, pid)[0] || null; // the FOURTH seat, if any
  const hasSuit = M.leadSuit && legal.some((c) => c.suit === M.leadSuit);

  if (w && M.team(w.player) === M.team(pid)) {
    // Partner owns the trick. Duck: play the lowest card that does NOT overtake
    // partner, while still holding a higher one (the "guarded suit" continuation
    // signal). The fourth seat must then beat partner's card with a premium.
    const pool = hasSuit ? legal.filter((c) => c.suit === M.leadSuit) : legal;
    const duck = pool.filter((c) => !beats(M, c, w.card)).sort((a, b) => valOf(M, a) - valOf(M, b))[0];
    if (duck) {
      const stillHigher = pool.some((c) => beats(M, c, w.card) && c !== duck);
      if (last && M.team(last) !== M.team(pid) && stillHigher) {
        return ok(scoredFor(scored, duck),
          `${nm(duck)} زیر یار — نفر چهارم مجبور است کارت باارزش خرج دهد`, 'THIRD_MAX_PRESSURE');
      }
      return ok(scoredFor(scored, duck),
        `${nm(duck)} زیر یار بازی می‌شود؛ دست برای یار امن است`, 'DUCK_UNDER_PARTNER');
    }
    // Everything overtakes partner (we only hold winners of the suit): it is still
    // partner's trick — do not burn a winner when the team already wins.
    const shed = pool.slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
    return ok(scoredFor(scored, shed),
      `یار برنده است؛ ${nm(shed)} دور انداخته می‌شود`, 'SHED_KEEP_TRUMP');
  }

  // An opponent is winning (or the trick is open). Try to beat them cheaply.
  if (w && M.team(w.player) !== M.team(pid)) {
    const pool = hasSuit ? legal.filter((c) => c.suit === M.leadSuit) : legal;
    const trump = M.mode === 'normal' ? M.trump : null;
    let cheap = cheapestBeater(M, pool, w.card);
    // void in the led suit: a trump ruff is the beater
    if (!cheap && trump && pool.some((c) => c.suit === trump)) {
      cheap = pool.filter((c) => c.suit === trump).sort((a, b) => valOf(M, a) - valOf(M, b))
        .find((c) => beats(M, c, w.card)) || null;
    }
    if (cheap) {
      const tag = last && M.team(last) !== M.team(pid)
        ? 'THIRD_MAX_PRESSURE'
        : 'CHEAPEST_SUFFICIENT_WIN';
      return ok(scoredFor(scored, cheap),
        `${nm(cheap)} برنده فعلی را با کمترین هزینه می‌برد`, tag);
    }
  }

  // Nothing wins: discard/defense — lowest future value, keep trump for later.
  const shed = legal.slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
  return ok(scoredFor(scored, shed),
    `امکان برد این دست نیست؛ ${nm(shed)} دفاعی دور انداخته می‌شود`, 'DISCARD_DEFENSE');
}

// ===========================================================================
// FOURTH — last to act, three cards on the table.
// ===========================================================================
// Obligations (spec): the decisive question — CAN fourth beat the current winner?
//   • if YES: decide from the game state and the trick's value. Take it with the
//     cheapest sufficient card when the trick matters or the team needs it; if
//     partner is already winning, deliberately do NOT overtake them
//   • if NO: discard the lowest-value card; never waste an honor on a lost trick
function fourthPolicy(s, pid) {
  const { scored, M } = scoreMoves(s, pid);
  if (!scored.length) return null;
  const legal = playable(s, pid);
  const w = winnerOfTrick(M);
  const hasSuit = M.leadSuit && legal.some((c) => c.suit === M.leadSuit);
  const pool = hasSuit ? legal.filter((c) => c.suit === M.leadSuit) : legal;
  const team = M.team(pid);

  // --- can we beat the current winner at all? ---
  const canBeat = w ? pool.filter((c) => beats(M, c, w.card)) : pool;

  // Partner is winning: never overtake. The team already has the trick; burning a
  // winner here costs a trick later. Duck the lowest non-overtaking card.
  if (w && team === M.team(w.player)) {
    const ducks = pool.filter((c) => !beats(M, c, w.card));
    const pick = (ducks.length ? ducks : pool).slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
    return ok(scoredFor(scored, pick),
      `یار برنده است؛ ${nm(pick)} بدون قاپیدن دست یار بازی می‌شود`, 'DO_NOT_OVERTAKE_PARTNER');
  }

  if (w && canBeat.length) {
    // Take with the cheapest sufficient card.
    const cheap = canBeat.slice().sort((a, b) => valOf(M, a) - valOf(M, b))[0];
    // Is the trick worth taking right now? Late game or a close score → yes, always.
    // Early with a dominant position → still yes: a guaranteed trick is a guaranteed
    // trick, and fourth seat taking cheaply costs the opponents a premium.
    const worth = trickWorthTaking(M, pid);
    if (worth) {
      return ok(scoredFor(scored, cheap),
        `${nm(cheap)} برنده را می‌برد — نفر چهارم با کمترین کارت کافی دست را می‌گیرد`, 'FOURTH_TAKE_CHEAPEST');
    }
    // Not worth committing a winner: still take it if the card we'd use is not a
    // future winner (cheap small card), otherwise duck and keep the honor.
    if (valOf(M, cheap) <= 8) {
      return ok(scoredFor(scored, cheap),
        `${nm(cheap)} ارزان است و دست را می‌برد`, 'FOURTH_TAKE_CHEAPEST');
    }
    const ducks = pool.filter((c) => !beats(M, c, w.card));
    if (ducks.length) {
      const pick = ducks.slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
      return ok(scoredFor(scored, pick),
        `ارزش این دست برد ندارد؛ ${nm(pick)} نگه داشته می‌شود و عقب‌نشینی می‌کنیم`, 'FOURTH_STRATEGIC_DUCK');
    }
    return ok(scoredFor(scored, cheap),
      `${nm(cheap)} تنها گزینه برای بردن است`, 'FOURTH_TAKE_CHEAPEST');
  }

  // --- cannot beat anyone: discard/defense ---
  const shed = pool.slice().sort((a, b) => shedCost(M, a) - shedCost(M, b))[0];
  return ok(scoredFor(scored, shed),
    `نمی‌توان برنده فعلی را زد؛ ${nm(shed)} کم‌ارزش‌ترین کارت آینده است`, 'FOURTH_DISCARD_LOW');
}

// ===========================================================================
// Dispatcher: the single entry point the AI uses. Routes by position, so a seat can
// NEVER decide outside its position's state machine (spec §1/§4).
// ===========================================================================
function decideByPosition(s, pid) {
  const pos = positionOf(s, pid);
  const fn = { LEADER: leaderPolicy, SECOND: secondPolicy, THIRD: thirdPolicy, FOURTH: fourthPolicy }[pos];
  const out = fn(s, pid);
  if (!out) return null;
  return { ...out, position: pos };
}

// ---------- internals ----------

// Shed cost: lowest future value first, but never prefer trump when a non-trump can
// be shed (keeping trump is almost always worth more than keeping a small spot card).
function shedCost(M, c) {
  let v = valOf(M, c);
  if (M.mode === 'normal' && c.suit === M.trump) v += 20;
  return v;
}

// Is taking THIS trick worth committing a winner for? Decision-time observables:
// score gap, trick number, and whether the team is at a Kot boundary.
function trickWorthTaking(M, pid) {
  const team = M.team(pid);
  const opp = team === 'A' ? 'B' : 'A';
  const gap = M.tricksWon[opp] - M.tricksWon[team]; // >0 means we are behind
  const tricksLeft = Math.max(0, 13 - M.trickNum + 1);
  if (M.tricksWon[team] >= 6 || M.tricksWon[opp] >= 6) return true; // endgame: every trick is decisive
  if (gap > 0) return true;       // behind: take what we can
  if (tricksLeft <= 4) return true; // few chances left
  return false;                   // early and ahead: the trick is not worth an honor
}

// Find the scored entry whose card matches `card` (same suit+rank).
function scoredFor(scored, card) {
  return scored.find((m) => ckey(m.card) === ckey(card)) || { card, score: 0, goals: [] };
}

function ok(scoredEntry, reason, goal) {
  const goals = scoredEntry.goals || [];
  return {
    card: scoredEntry.card,
    pick: scoredEntry,
    reason,
    goals: goal && !goals.includes(goal) ? [goal, ...goals] : goals,
  };
}
const rankedGoals = (m) => m.goals && m.goals.length ? m.goals[0] : null;

// src/ai.js — public AI surface (facade over the Decision Engine).
// aiPick stays signature-compatible with the game controller. The engine reads
// ONLY the observable knowledge layer (src/knowledge.js) — opponents' hidden
// hands are never consulted.
//
// Two layers, both deterministic (§7):
//   decide()            — the scorer: ranks every legal move with a fixed tie-break.
//   decideByPosition()  — the Position Policies (LEADER/SECOND/THIRD/FOURTH), each
//                         owning its decision rights and individually testable.
// aiPick plays through the position policies; decide() stays available to the
// Analysis/Coach features that want the ranked list.



function aiPick(s, pid) {
  const d = decideByPosition(s, pid) || decide(s, pid);
  return d ? d.card : s.players[pid].hand[0];
}

// Exposed for the Coach + Analysis features (they share this exact engine).

// ---------- Trump selection (declarer AI) ----------
// TrumpScore: length + raw strength + sequences (QJ10 / KQJ10 worth more than
// isolated J/10) + honors + future value + score context. Project heuristic kept
// as SOFT tie-break only: A+K together in a suit is slightly penalized because
// they nearly win without trumps — never decisive.
function pickAiTrump(hand5, s = null) {
  const bySuit = { spades: [], hearts: [], diamonds: [], clubs: [] };
  for (const c of hand5) bySuit[c.suit].push(c);
  let best = 'spades', bs = -Infinity;
  for (const suit of SUITS) {
    const cards = bySuit[suit].slice().sort((a, b) => cardVal(b, 'normal') - cardVal(a, 'normal'));
    if (!cards.length) continue;
    const ranks = cards.map((c) => c.rank);
    let sc = cards.length * 5;
    for (const c of cards) sc += cardVal(c, 'normal') * 0.7;
    if (seqRun(ranks, 'AKQJ')) sc += 6;
    else if (seqRun(ranks, 'KQJ10')) sc += 6;
    else if (seqRun(ranks, 'QJ10')) sc += 4;
    else if (seqRun(ranks, 'J10')) sc += 2;
    const hasA = ranks.includes('A'), hasK = ranks.includes('K');
    if (hasA) sc += 3;
    if (hasK) sc += 1.5;
    if (hasA && hasK && cards.length >= 2) sc -= 4;      // soft A+K heuristic
    if (cards.length >= 4) sc += 2;                       // ruff potential (future value)
    if (s) {
      const team = s.players ? s.players[s.hakem].team : null;
      if (team) {
        const opp = team === 'A' ? 'B' : 'A';
        const gap = s.score[team] - s.score[opp];
        if (gap <= -2 && cards.length >= 4) sc += 1.5;    // behind → bet on length
        if (gap >= 2 && (hasA || hasK)) sc += 1;          // ahead → bet on control
      }
    }
    if (sc > bs) { bs = sc; best = suit; }
  }
  return best;
}

// ranks sorted descending; pattern must appear as a (gap-free) ordered subsequence
function seqRun(descRanks, pat) {
  const chars = pat === 'J10' ? ['J', '10'] : pat === 'QJ10' ? ['Q', 'J', '10']
    : pat === 'KQJ10' ? ['K', 'Q', 'J', '10'] : ['A', 'K', 'Q', 'J'];
  let i = 0;
  for (const r of descRanks) { if (r === chars[i]) i++; if (i === chars.length) return true; }
  return false;
}

// src/advisor.js — Analysis + Coach. BOTH reuse the exact Decision Engine
// (decision.js) over the exact knowledge layer (knowledge.js). No second engine,
// no contradiction, no hindsight, zero side effects:
//   • gradeMove: reconstruct the decision-time view (cards played BEFORE that
//     trick's own plays are included only up to the moment of the move), so the
//     hidden cards that were still hidden are still unaccounted holders here.
//     The ACTUAL outcome is compared separately — outcome ≠ decision quality.
//   • coachHint: what the engine would play right now for seat pid, plus reason.


// Build the state as it looked AT THE MOMENT of a recorded move.
// Gnow: current live state. entry: recorded trick entry (player, card, trickNum,
// position). We rewind memory to before that trick's plays from that position.
function decisionTimeView(Gnow, trickSnapshot, position) {
  // trickSnapshot: a deep copy of state as it was at START of that trick
  // (trick=[], leadSuit=null, memory = played up to before this trick)
  const s = JSON.parse(JSON.stringify(trickSnapshot));
  for (let i = 0; i < position; i++) {
    const e = s.trickStartEntries[i];
    // replay earlier plays of this trick exactly as doPlayCard does — including
    // REMOVING the played card from that seat's hand, so the viewer's decision-time
    // hand is the hand they actually had then
    const h = s.players[e.player].hand;
    const hi = h.findIndex((x) => x.suit === e.card.suit && x.rank === e.card.rank);
    if (hi > -1) h.splice(hi, 1);
    s.trick.push({ player: e.player, card: e.card });
    if (s.trick.length === 1) s.leadSuit = e.card.suit;
    s.memory.played.push({ ...e.card });
    if (s.leadSuit && e.card.suit !== s.leadSuit) {
      if (!s.memory.voids[e.player]) s.memory.voids[e.player] = [];
      if (!s.memory.voids[e.player].includes(s.leadSuit)) s.memory.voids[e.player].push(s.leadSuit);
    }
  }
  delete s.trickStartEntries;
  return s;
}

// gradeMove compares the HUMAN's recorded choice against the engine's ranking at
// decision time. quality: excellent / good / improvable / mistake.
function gradeMove(Gnow, trickSnapshots, trickNum, position, pid, playedCard) {
  const snap = trickSnapshots[trickNum];
  if (!snap) return null;
  const s = decisionTimeView(Gnow, snap, position);
  const legal = playable(s, pid);
  const chosen = legal.find((c) => c.suit === playedCard.suit && c.rank === playedCard.rank);
  if (!chosen) return null;
  const d = decide(s, pid, () => 0); // deterministic: no variation in grading
  if (!d) return null;
  const top = d.top;
  const pick = d.ranked.find((x) => x.card.suit === chosen.suit && x.card.rank === chosen.rank);
  const gap = top.score - (pick ? pick.score : -Infinity);
  let quality;
  if (pick && pick.card === top.card || gap <= 0.0001) quality = 'excellent';
  else if (gap <= 1.5) quality = 'good';
  else if (gap <= 4) quality = 'improvable';
  else quality = 'mistake';
  // the better move, if any, and the reason from decision-time info ONLY
  const better = quality === 'excellent' ? null : top;
  // §8 Tactic recognition: the goals the chosen move carries, computed by the same
  // Decision Engine over the same decision-time view — no hindsight, no second
  // engine. This is how the Analyzer sees "♥3 under partner's ♥Q" as a deliberate
  // THIRD_SEAT_MAX_PRESSURE / PARTNER_CONTINUATION_SIGNAL rather than a low-card dump.
  const tactics = (pick ? pick.goals : []).filter((g) => TACTIC_GOALS.has(g));
  return {
    quality, gap,
    played: playedCard,
    better: better ? better.card : null,
    reason: better ? explain(top) : explain(pick),
    tactics,
    tacticLabels: tactics.map((g) => TACTIC_LABELS[g] || g),
    outcomeNote: null, // filled by the UI with the ACTUAL trick winner — kept separate from decision quality
  };
}

// §9 goals surfaced as named tactics in Analysis (subset of decision.js GOALS —
// the positional/tactical ones worth showing next to a graded move).
const TACTIC_GOALS = new Set([
  'THIRD_SEAT_MAX_PRESSURE', 'FORCE_OPPONENT_PREMIUM_RESPONSE',
  'ESTABLISH_SECONDARY_HONOR', 'TRUMP_CONTROL', 'ANTI_KOT',
  'PARTNER_CONTINUATION_SIGNAL', 'FORCE_EXPENSIVE_RESPONSE',
]);
const TACTIC_LABELS = {
  THIRD_SEAT_MAX_PRESSURE: 'فشار نفر سوم',
  FORCE_OPPONENT_PREMIUM_RESPONSE: 'مجبور کردن حریف به خرج A/K',
  ESTABLISH_SECONDARY_HONOR: 'برقراری جایزهٔ دوم (K/Q بعداً)',
  TRUMP_CONTROL: 'حفظ کنترل حکم',
  ANTI_KOT: 'استراتژی ضد کت',
  PARTNER_CONTINUATION_SIGNAL: 'سیگنال ادامه به یار',
  FORCE_EXPENSIVE_RESPONSE: 'پاسخ گران برای حریف',
};

// coach: current best suggestion + optional second. Reads nothing but observables;
// touches no state; the player may ignore it entirely. decide() is a pure function
// of the state (verified in tests/determinism.test.js + tests/observability.test.js),
// so the state is passed by reference — cloning it here would needlessly materialize
// the OTHER seats' hidden hands into a copy the engine never reads (spec §8).
function coachHint(Gnow, pid) {
  const d = decide(Gnow, pid);
  if (!d) return null;
  const second = d.ranked[1] && d.ranked[1].score >= d.top.score - 3 ? d.ranked[1] : null;
  return {
    best: d.top.card, bestReason: explain(d.top),
    alt: second ? second.card : null, altReason: second ? explain(second) : null,
  };
}

// Snapshot the full observable state at the START of a trick so that Analysis can
// later re-grade each seat's move with ONLY the information that seat had then.
function snapshotTrickStart(G) {
  return {
    players: JSON.parse(JSON.stringify(G.players)),
    trump: G.trump, trumpMode: G.trumpMode, trickNum: G.trickNum,
    starter: G.starter, tricksWon: { ...G.tricksWon },
    score: { ...G.score }, hakem: G.hakem,
    memory: JSON.parse(JSON.stringify(G.memory)),
    trick: [], leadSuit: null,
    trickStartEntries: [],
  };
}

// record an entry into the snapshot as plays happen (positions 0..3)
function appendToSnapshot(snap, entry) {
  snap.trickStartEntries.push({ player: entry.player, card: entry.card });
}

// Hokm game flow controller. Mirrors old index.html control flow (startGame ->
// startRound -> dealFirst -> selectTrump -> dealRest -> startTrick -> nextTurn ->
// endTrick -> handleKot/endRound -> checkGameEnd/showEnd) bit-for-bit, with all
// presentation effects (delay/sfx/render/popup) injected via `view`.



function createState() {
  return {
    players: {
      1: { name: 'شما', hand: [], team: 'A' },
      2: { name: 'حریف۱', hand: [], team: 'B' },
      3: { name: 'یار', hand: [], team: 'A' },
      4: { name: 'حریف۲', hand: [], team: 'B' },
    },
    hakem: null, trump: null, trumpMode: 'normal',
    trick: [], leadSuit: null, current: null, starter: null,
    tricksWon: { A: 0, B: 0 }, score: { A: 0, B: 0 },
    trickNum: 0, phase: 'idle', processing: false,
    selectedCard: null, deck: [],
    memory: { played: [], voids: {}, aces: {}, kings: {}, signals: [], tricks: [] },
    kotTeam: null, kotPoints: 0, bamMode: false, roundHistory: [], lastTrick: null,
  };
}

// view: { delay(ms), sfx(name), renderTableCard(pid, card), renderHand(), updateUI(),
//         showPopup(text), hidePopup(), showTrumpPicker(), showKot(msg), showRound(title, html),
//         showEnd(title, html), saveG(s), clearTable() }
function createGame(view, rng = Math.random, storage = null) {
  const G = createState();
  // decision-time snapshots per trick (for Analysis) — kept OUTSIDE G so saves
  // stay small; exposed via getTrickSnap().
  const trickSnaps = {};

// deal order follows play order: start at the seat after the dealer (hakem), end
// at hakem itself. With NEXT = 1→4→3→2→1 this is counter-clockwise (real Hokm).
function dealOrder(hakem) {
  const seq = [];
  let p = hakem;
  for (let i = 0; i < 3; i++) { p = NEXT[p]; seq.push(p); }
  seq.push(hakem);
  return seq; // e.g. hakem=1 → [4, 3, 2, 1]
}
  async function doPlayCard(pid, c, recommended = null) {
    view.sfx('cardPlay');
    const h = G.players[pid].hand;
    const i = h.findIndex((x) => x.suit === c.suit && x.rank === c.rank);
    if (i > -1) h.splice(i, 1);
    const necessary = G.trick.length === 0 && G.trumpMode === 'normal' && c.suit === G.trump;
    // signal-quality bookkeeping: was this follow-suit card FORCED (no lower card
    // in the led suit available)? voluntary strong cards are real partner signals.
    let forcedFollow = false;
    if (G.leadSuit && c.suit === G.leadSuit) {
      const same = h.filter((x) => x.suit === G.leadSuit);
      forcedFollow = same.every((x) => cardVal(x, G.trumpMode) >= cardVal(c, G.trumpMode));
    }
    // §4 PARTNER_CONTINUATION_SIGNAL candidate: I follow the led suit with a LOWER
    // card than partner's currently-winning one while STILL holding a higher card of
    // that suit ("the suit is guarded — lead it again"). Recorded as a signal only if
    // the partner actually takes the trick (endTrick). Own-hand info only, no hiding.
    let contSignal = false;
    if (G.trick.length && G.leadSuit && c.suit === G.leadSuit) {
      let w = G.trick[0];
      for (const t of G.trick) if (cmpCards(t.card, w.card, G.leadSuit, G.trumpMode, G.trump) > 0) w = t;
      if (w.player === PARTNER[pid] &&
          cardVal(c, G.trumpMode) < cardVal(w.card, G.trumpMode) &&
          h.some((x) => x.suit === c.suit && cardVal(x, G.trumpMode) > cardVal(c, G.trumpMode))) {
        contSignal = true;
      }
    }
    G.trick.push({ player: pid, card: c, necessary, recommended, forcedFollow, contSignal });
    if (G.trick.length === 1) G.leadSuit = c.suit;
    if (trickSnaps[G.trickNum]) appendToSnapshot(trickSnaps[G.trickNum], { player: pid, card: c });
    G.memory.played.push({ ...c });
    if (c.rank === 'A') G.memory.aces[c.suit] = true;
    if (c.rank === 'K') G.memory.kings[c.suit] = true;
    if (G.leadSuit && c.suit !== G.leadSuit) {
      if (!G.memory.voids[pid]) G.memory.voids[pid] = [];
      if (!G.memory.voids[pid].includes(G.leadSuit)) G.memory.voids[pid].push(G.leadSuit);
    }
    view.renderTableCard(pid, c, necessary);
    if (pid === 1) view.renderHand();
    if (necessary) {
      view.showPopup(`${G.players[pid].name}: لازم!`);
      await view.delay(900);
      view.hidePopup();
    }
  }

  async function nextTurn() {
    if (G.trick.length === 4) { await endTrick(); return; }
    G.current = NEXT[G.current];
    view.updateUI();
    if (G.current !== 1) {
      await view.delay(550);
      await doPlayCard(G.current, aiPick(G, G.current));
      await nextTurn();
    } else {
      G.processing = false;
      G.selectedCard = null;
      view.renderHand();
    }
  }

  async function endTrick() {
    G.phase = 'trickEnd';
    const w = trickWinner(G.trick, G.leadSuit, G.trumpMode, G.trump);
    G.lastTrick = { entries: G.trick.map((t) => ({ player: t.player, card: t.card, necessary: t.necessary, recommended: t.recommended, forcedFollow: t.forcedFollow })), winner: w.player, trickNum: G.trickNum };

    // partner-answer signals (quality-aware, per AI spec):
    // • hakem leads trick 1 in a non-trump suit voluntarily → strong signal (2)
    // • a strong card played when the player COULD have played lower in that suit
    //   (voluntary) → signal weight 2; if it was their lowest / forced follow → 1.
    // • a trump ruff-win already recorded the suit void in doPlayCard; trump SIZE
    //   is never treated as strength evidence unless enough was observed.
    const leaderEntry = G.trick[0];
    if (G.trickNum === 1 && leaderEntry.player === G.hakem && !leaderEntry.necessary) {
      recordSignal(G, leaderEntry.player, leaderEntry.card.suit, 2);
    }
    for (const t of G.trick) {
      if (t.player === leaderEntry.player) continue;
      if (t.card.suit !== G.leadSuit) continue; // following only, never ruffs
      if (t.player === w.player) continue;       // they actually won — real trick, not a signal
      if (cardVal(t.card, G.trumpMode) >= 7) {
        // quality: forced (no lower card in suit to shed) → weak signal 1,
        // voluntary strong card → full signal 2 (ruff-size never = trump strength)
        recordSignal(G, t.player, t.card.suit, t.forcedFollow ? 1 : 2);
      }
    }
    // §4 PARTNER_CONTINUATION_SIGNAL: the duck happened AND the partner actually took
    // the trick → "this suit is guarded in my hand, lead it again" (weight 2).
    for (const t of G.trick) {
      if (t.contSignal && w.player === PARTNER[t.player]) {
        recordSignal(G, t.player, t.card.suit, 2);
      }
    }

    G.tricksWon[G.players[w.player].team]++;
    // §6 knowledge: completed-trick history — leadSuit, every play, the winner and
    // her team. This is exactly what a human at the table would remember; the AI
    // reads it via buildMemory().tricks.
    if (!G.memory.tricks) G.memory.tricks = [];
    G.memory.tricks.push({
      trickNum: G.trickNum,
      leadSuit: G.leadSuit,
      winner: w.player,
      team: G.players[w.player].team,
      plays: G.trick.map((t) => ({ player: t.player, card: { ...t.card } })),
    });
    view.sfx(G.players[w.player].team === 'A' ? 'trickWinUs' : 'trickWinThem');
    view.updateUI();
    view.showPopup(`${G.players[w.player].name} برد!`);
    await view.delay(1000);
    view.hidePopup();
    G.starter = w.player;

    if (G.bamMode) {
      if (G.tricksWon[G.kotTeam] === 13) {
        logRound({ tricksA: G.tricksWon.A, tricksB: G.tricksWon.B, winner: G.kotTeam, pts: G.kotPoints, trump: currentTrumpLabel(), kot: true, bam: true });
        showEnd(G.kotTeam, true);
        return;
      }
      if (G.trickNum === 13) { await endRound(); return; }
      await startTrick();
      return;
    }

    if (G.tricksWon.A === 7 && G.tricksWon.B === 0) { await handleKot('A'); return; }
    if (G.tricksWon.B === 7 && G.tricksWon.A === 0) { await handleKot('B'); return; }
    if (G.tricksWon.A >= 7 || G.tricksWon.B >= 7) { await endRound(); return; }
    if (G.trickNum === 13) { await endRound(); return; }
    await startTrick();
  }

  function currentTrumpLabel() {
    if (G.trumpMode === 'normal') return G.trump ? SYMBOLS[G.trump] : '-';
    if (G.trumpMode === 'ners') return '(2) نرس';
    if (G.trumpMode === 'asners') return '(A2) آسنرس';
    return '(A) سرس';
  }

  function logRound(entry) { G.roundHistory.push(entry); }

  async function handleKot(team) {
    G.kotTeam = team;
    G.kotPoints = getKotPoints(G, team);
    if (team === 'A') {
      view.sfx('kotUs');
      view.showKot(`کت کردید! (+${G.kotPoints} امتیاز)`);
    } else {
      view.sfx('kotThem');
      G.score[team] += G.kotPoints;
      view.updateUI();
      if (rng() < 0.15) {
        G.bamMode = true;
        view.showPopup('حریف درخواست بام!');
        await view.delay(1500);
        view.hidePopup();
        await startTrick();
      } else {
        logRound({ tricksA: G.tricksWon.A, tricksB: G.tricksWon.B, winner: team, pts: G.kotPoints, trump: currentTrumpLabel(), kot: true, bam: false });
        const hTeam2 = G.players[G.hakem].team;
        if (team !== hTeam2) G.hakem = NEXT[G.hakem];
        if (checkGameEnd()) return;
        view.showRound('کت شدید!', `+${G.kotPoints} امتیاز حریف<br><br>کل: ${G.score.A} - ${G.score.B}`, 'them');
      }
    }
  }

  async function endRound() {
    G.phase = 'roundEnd';
    let winner = null, pts = 0;
    if (G.tricksWon.A >= 7) { winner = 'A'; pts = 1; G.score.A += 1; }
    else if (G.tricksWon.B >= 7) { winner = 'B'; pts = 1; G.score.B += 1; }
    logRound({ tricksA: G.tricksWon.A, tricksB: G.tricksWon.B, winner, pts, trump: currentTrumpLabel(), kot: !!G.kotTeam, bam: false });
    view.updateUI();
    const hTeam = G.players[G.hakem].team;
    if (winner && winner !== hTeam) G.hakem = NEXT[G.hakem];
    if (checkGameEnd()) return;
    view.showRound(winner === 'A' ? 'برنده شدید!' : 'باختید', `دستها: ${G.tricksWon.A} - ${G.tricksWon.B}<br>امتیاز: +${pts}<br><br>کل: ${G.score.A} - ${G.score.B}`, winner === 'A' ? 'us' : 'them');
  }

  function checkGameEnd() {
    if (G.score.A >= 7) { showEnd('A', false); return true; }
    if (G.score.B >= 7) { showEnd('B', false); return true; }
    return false;
  }

  function showEnd(w, isBam) {
    let title, msg;
    if (isBam) {
      title = w === 'A' ? '🎉 بام! برنده شدید!' : '💀 بام! باختید!';
      msg = 'با گرفتن ۱۳ دست، بازی تمام شد!';
      view.sfx(w === 'A' ? 'bam' : 'lose');
    } else {
      title = w === 'A' ? '🎉 برنده شدید!' : 'باختید!';
      msg = `${G.score.A} - ${G.score.B}`;
      view.sfx(w === 'A' ? 'win' : 'lose');
    }
    view.showEnd(title, msg, w);
    if (storage) storage.onGameEnd(w, G);
    if (storage) storage.clearSave();
  }

  async function startTrick() {
    G.trickNum++;
    G.trick = [];
    G.leadSuit = null;
    G.phase = 'play';
    G.processing = false;
    G.selectedCard = null;
    trickSnaps[G.trickNum] = snapshotTrickStart(G); // decision-time base for Analysis
    view.clearTable();
    if (G.trickNum === 1) G.starter = G.hakem;
    G.current = G.starter;
    view.updateUI();
    view.renderHand();
    if (G.current !== 1) {
      G.processing = true;
      await view.delay(550);
      await doPlayCard(G.current, aiPick(G, G.current));
      await nextTurn();
    }
  }

  async function dealRest() {
    const order = dealOrder(G.hakem);
    let i = 0;
    for (let r = 0; r < 8; r++) {
      for (const pid of order) {
        G.players[pid].hand.push(G.deck[20 + i++]);
      }
    }
    for (let p = 1; p <= 4; p++) G.players[p].hand = sortHand(G.players[p].hand, G.trump, G.trumpMode);
    view.renderHand();
    await view.delay(300);
    await startTrick();
  }

  function setTrump(mode, suit) {
    G.trumpMode = mode;
    G.trump = suit;
    view.updateUI();
  }

  async function selectTrump() {
    G.phase = 'trump';
    if (G.hakem === 1) {
      view.showTrumpPicker(sortHand(G.players[1].hand.slice(0, 5), null, 'normal'));
    } else {
      await view.delay(700);
      setTrump('normal', pickAiTrump(G.players[G.hakem].hand.slice(0, 5), G));
      await dealRest();
    }
  }

  async function dealFirst() {
    G.phase = 'deal';
    G.deck = shuffle(makeDeck(), rng);
    const order = dealOrder(G.hakem);
    let i = 0;
    for (let r = 0; r < 5; r++) {
      for (const pid of order) {
        G.players[pid].hand.push(G.deck[i++]);
      }
    }
    view.renderHand();
    await selectTrump();
  }

  async function startRound() {
    G.tricksWon = { A: 0, B: 0 };
    G.trickNum = 0;
    G.trump = null;
    G.trumpMode = 'normal';
    G.trick = [];
    G.leadSuit = null;
    G.kotTeam = null;
    G.kotPoints = 0;
    G.bamMode = false;
    G.lastTrick = null;
    G.processing = false;
    G.selectedCard = null;
    G.memory = { played: [], voids: {}, aces: {}, kings: {}, signals: [], tricks: [] };
    for (let i = 1; i <= 4; i++) G.players[i].hand = [];
    view.updateUI();
    view.clearTable();
    await dealFirst();
  }

  function startGame() {
    if (storage) storage.clearSave();
    G.score = { A: 0, B: 0 };
    G.roundHistory = [];
    G.hakem = Math.floor(rng() * 4) + 1;
    return startRound();
  }

  // Human picks a card via UI. Mirrors old playCardHuman.
  async function playHuman(c) {
    G.processing = true;
    const recommended = aiPick(G, 1);
    await doPlayCard(1, c, recommended);
    await nextTurn();
  }

  // Human declarer finished picking trump in the modal.
  async function humanChoseTrump(mode, suit) {
    setTrump(mode, suit);
    await dealRest();
  }

  async function continueFrom(loaded) {
    Object.assign(G, createState());
    G.players = loaded.players; G.hakem = loaded.hakem; G.trump = loaded.trump;
    G.trumpMode = loaded.trumpMode; G.trick = loaded.trick; G.leadSuit = loaded.leadSuit;
    G.current = loaded.current; G.starter = loaded.starter; G.tricksWon = loaded.tricksWon;
    G.score = loaded.score; G.trickNum = loaded.trickNum; G.phase = loaded.phase;
    G.processing = false; G.selectedCard = null;
    G.deck = loaded.deck || [];
    G.memory = loaded.memory || { played: [], voids: {}, aces: {}, kings: {}, signals: [], tricks: [] };
    if (!G.memory.signals) G.memory.signals = [];
    G.kotTeam = loaded.kotTeam; G.kotPoints = loaded.kotPoints; G.bamMode = loaded.bamMode;
    G.roundHistory = loaded.roundHistory || []; G.lastTrick = loaded.lastTrick || null;
    view.clearTable();
    for (const t of G.trick) view.renderTableCard(t.player, t.card, t.necessary);
    view.renderHand();
    view.updateUI();
    if (G.current !== 1 && G.phase === 'play') {
      G.processing = true;
      await view.delay(550);
      await doPlayCard(G.current, aiPick(G, G.current));
      await nextTurn();
    }
  }

  // UI answers bam request (bamYes / bamNo)
  async function bamAccept() {
    G.score[G.kotTeam] += G.kotPoints;
    view.updateUI();
    G.bamMode = true;
    await startTrick();
  }
  async function bamDecline() {
    G.score[G.kotTeam] += G.kotPoints;
    view.updateUI();
    logRound({ tricksA: G.tricksWon.A, tricksB: G.tricksWon.B, winner: G.kotTeam, pts: G.kotPoints, trump: currentTrumpLabel(), kot: true, bam: false });
    const hTeam = G.players[G.hakem].team;
    if (G.kotTeam !== hTeam) G.hakem = NEXT[G.hakem];
    if (checkGameEnd()) return;
    view.showRound('کت کردید!', `+${G.kotPoints} امتیاز<br><br>کل: ${G.score.A} - ${G.score.B}`, 'us');
  }

  return {
    G, playable: (pid) => playable(G, pid), doPlayCard, nextTurn, startTrick, endTrick,
    startGame, startRound, playHuman, humanChoseTrump, continueFrom, bamAccept, bamDecline,
    currentTrumpLabel, checkGameEnd,
    trickSnaps, // read by Analysis (src/advisor.js → gradeMove)
  };
}

// Hokm persistence. Same localStorage keys as the original app; the in-progress
// game save is now LZ-compressed (UTF-16) to shrink the cached blob. Load falls
// back to plain JSON so old saves still resume.
const SAVE_KEY = 'hokm_save_v1';
const STATS_KEY = 'hokm_stats_v1';
const SOUND_KEY = 'hokm_sound_v1';

function saveGame(lz, store, state) {
  try { store.setItem(SAVE_KEY, lz.compressToUTF16(JSON.stringify(state))); } catch (e) { /* quota/no-store */ }
}

function loadGame(lz, store) {
  const parse = (t) => { try { return t ? JSON.parse(t) : null; } catch (e) { return null; } };
  try {
    const raw = store.getItem(SAVE_KEY);
    if (!raw) return null;
    return parse(lz.decompressFromUTF16(raw)) || parse(raw); // compressed first, legacy plain-JSON fallback
  } catch (e) { return null; }
}

function clearSave(store) {
  try { store.removeItem(SAVE_KEY); } catch (e) { /* noop */ }
}

function defaultStats() {
  return { gamesPlayed: 0, gamesWon: 0, gamesLost: 0, kots: 0, bams: 0 };
}

function loadStats(store) {
  try {
    const raw = store.getItem(STATS_KEY);
    return raw ? Object.assign(defaultStats(), JSON.parse(raw)) : defaultStats();
  } catch (e) { return defaultStats(); }
}

function saveStats(store, s) {
  try { store.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) { /* noop */ }
}

// old updateStatsOnGameEnd (index.html 1118-1128)
function updateStatsOnGameEnd(store, winner, G) {
  const s = loadStats(store);
  s.gamesPlayed++;
  if (winner === 'A') s.gamesWon++; else s.gamesLost++;
  for (const r of G.roundHistory) {
    if (r.kot && r.winner === 'A') s.kots++;
    if (r.bam && r.winner === 'A') s.bams++;
  }
  saveStats(store, s);
  return s;
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, gainVal, delayFromNow) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t0 = ctx.currentTime + (delayFromNow || 0);
    gain.gain.setValueAtTime(gainVal || 0.14, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  } catch (e) { /* ignore */ }
}
const SFX = {
  cardPlay: () => playTone(520, 0.07, 'triangle', 0.09, 0),
  trickWinUs: () => { playTone(660, 0.1, 'sine', 0.13, 0); playTone(880, 0.14, 'sine', 0.13, 0.09); },
  trickWinThem: () => playTone(340, 0.14, 'sine', 0.1, 0),
  kotUs: () => { playTone(523, 0.12, 'sine', 0.15, 0); playTone(659, 0.12, 'sine', 0.15, 0.1); playTone(784, 0.22, 'sine', 0.15, 0.2); },
  kotThem: () => { playTone(300, 0.16, 'sawtooth', 0.09, 0); playTone(220, 0.22, 'sawtooth', 0.09, 0.12); },
  bam: () => { playTone(523, 0.1, 'sine', 0.17, 0); playTone(659, 0.1, 'sine', 0.17, 0.09); playTone(784, 0.1, 'sine', 0.17, 0.18); playTone(1047, 0.32, 'sine', 0.17, 0.27); },
  win: () => { playTone(523, 0.12, 'sine', 0.16, 0); playTone(659, 0.12, 'sine', 0.16, 0.1); playTone(784, 0.12, 'sine', 0.16, 0.2); playTone(1047, 0.3, 'sine', 0.16, 0.3); },

// §4B determinism: every shuffle / deal / hakem pick / bam request draws from ONE
// RNG. With ?seed=N the whole game replays byte-for-byte; without it, Math.random.
// The Decision Engine never receives this — AI choices stay pure (§4A).
const seedParam = new URLSearchParams((typeof location !== 'undefined' && location && location.search) || '').get('seed');
const gameRng = seedParam ? mulberry32(Number(seedParam) >>> 0) : Math.random;

const game = createGame(view, gameRng, null);
// Single source of truth: the engine owns the state object; every reassignment
// inside the engine (startTrick/startRound/continueFrom) keeps this reference valid
// because those mutate fields of game.G, never replace game.G itself.
const G = game.G;

// ---------- card DOM ----------
function createCardEl(c, sizeClass = '') {
  const el = document.createElement('div');
  const isTrump = G.trumpMode === 'normal' && c.suit === G.trump;
  el.className = `card suit-${c.suit}${isTrump ? ' trump' : ''}${sizeClass ? ' ' + sizeClass : ''}`;
  el.dataset.card = `${c.suit}:${c.rank}`;
  el.innerHTML = `<span class="card-rank">${c.rank}</span>
    <span class="card-suit-center">${SYMBOLS[c.suit]}</span>
    <span class="card-rank bottom">${c.rank}</span>`;
  return el;
}

function renderHand() {
  const cont = $('handCards');
  cont.innerHTML = '';
  const h = sortHand(G.players[1].hand, G.trump, G.trumpMode);
  G.players[1].hand = h;
  const can = game.playable(1);
  const myTurn = G.phase === 'play' && G.current === 1 && !G.processing;
  for (const c of h) {
    const el = createCardEl(c);
    const ok = myTurn && can.some((x) => x.suit === c.suit && x.rank === c.rank);
    if (!ok) el.classList.add('disabled');
    if (ok) el.onclick = () => selectCard(c);
    if (G.selectedCard && G.selectedCard.suit === c.suit && G.selectedCard.rank === c.rank) el.classList.add('selected');
    cont.appendChild(el);
  }
  applyCoach(cont, myTurn);
}

// Coach mode: mark the engine's suggestion on the hand + explain below it.
// Read-only: no state change, no forcing the player, engine = same aiPick logic.
function applyCoach(cont, myTurn) {
  const bar = $('coachBar');
  if (!coachOn || !myTurn || !G.players[1].hand.length) { bar.classList.add('hidden'); bar.innerHTML = ''; return; }
  const hint = coachHint(G, 1);
  if (!hint) { bar.classList.add('hidden'); return; }
  const key = (c) => `${c.suit}:${c.rank}`;
  const sym = SYMBOLS[hint.best.suit];
  for (const el of cont.children) {
    if (el.dataset.card === key(hint.best)) el.classList.add('coach-best');
    if (hint.alt && el.dataset.card === key(hint.alt)) el.classList.add('coach-alt');
  }
  const sym2 = hint.alt ? SYMBOLS[hint.alt.suit] : null;
  bar.classList.remove('hidden');
  bar.innerHTML = `<span class="coach-line">🎓 پیشنهاد آموزشی: <b>${sym}${hint.best.rank}</b> — ${hint.bestReason}</span>` +
    (hint.alt ? `<span class="coach-line alt">گزینه دوم: <b>${sym2}${hint.alt.rank}</b> — ${hint.altReason}</span>` : '');
}

function selectCard(c) {
  if (G.selectedCard && G.selectedCard.suit === c.suit && G.selectedCard.rank === c.rank) {
    G.selectedCard = null;
    game.playHuman(c);
  } else {
    G.selectedCard = c;
    renderHand();
  }
}

const QUALITY_LABEL = {
  excellent: ['عالی', 'good'],
  good: ['خوب', 'good'],

function showLastTrick() {
  if (!G.lastTrick) return;
  const cont = $('lastTrickCards');

      cardEl.appendChild(tag);
    }

    if (analysisOn) {
      // grade with decision-time info ONLY — no hindsight
      const snap = game.trickSnaps[G.lastTrick.trickNum];
      const g = snap && gradeMove(G, game.trickSnaps, G.lastTrick.trickNum, pos, pid, entry.card);
      const box = document.createElement('div');
      box.className = 'analysis-row';
      if (g) {
        const [label, tone] = QUALITY_LABEL[g.quality] || ['?', ''];
        box.classList.add(tone === 'good' ? 'good' : '');
        if (tone === 'bad') box.classList.add('bad');
        if (tone === 'warn') box.classList.add('warn');
        let html = `<span class="grade ${tone}">${label}</span> <span class="reason">${g.reason}</span>`;
        if (g.better) html += ` <span class="better">بهتر: ${SYMBOLS[g.better.suit]}${g.better.rank}</span>`;
        if (g.tacticLabels && g.tacticLabels.length) html += ` <span class="tactics">${g.tacticLabels.join(' · ')}</span>`;
        box.innerHTML = html;
      } else {
        box.innerHTML = '';
      }
      if (box.innerHTML) cont.appendChild(box);
    }
  }
  if (analysisOn) {
    const out = document.createElement('p');
    out.className = 'outcome-line';
    out.textContent = `نتیجهی واقعی: ${G.players[G.lastTrick.winner].name} برد.`;
    cont.appendChild(out);
  }
  void order;
  $('lastTrickModal').classList.add('show');
}
